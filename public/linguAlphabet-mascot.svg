<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" id="linguAlphabet-mascot-svg">
  <metadata>Title: Torty - linguAlphabet Mascot</metadata>
  <defs>
    <!-- Sage Green Skin Gradients -->
    <linearGradient id="sageSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bce0c8" />
      <stop offset="60%" stop-color="#9db8a3" />
      <stop offset="100%" stop-color="#7c9682" />
    </linearGradient>
    <linearGradient id="sageSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c9682" />
      <stop offset="100%" stop-color="#5a7060" />
    </linearGradient>

    <!-- Terracotta Shell Gradients -->
    <radialGradient id="terracottaShell" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e28a6a" />
      <stop offset="70%" stop-color="#c97456" />
      <stop offset="100%" stop-color="#a65437" />
    </radialGradient>
    <linearGradient id="shellTile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d98263" />
      <stop offset="100%" stop-color="#b56143" />
    </linearGradient>
    <linearGradient id="shellTile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf7657" />
      <stop offset="100%" stop-color="#96482e" />
    </linearGradient>

    <!-- Coral/Orange Headphones Gradients -->
    <linearGradient id="headphonesCoral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb082" />
      <stop offset="40%" stop-color="#ff8c42" />
      <stop offset="100%" stop-color="#e05e16" />
    </linearGradient>
    <radialGradient id="earcupGloss" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ff8c42" />
      <stop offset="100%" stop-color="#b54103" />
    </radialGradient>

    <!-- Deep Blue-Gray Eye Gradient -->
    <radialGradient id="eyeIris" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a5d6e" />
      <stop offset="60%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#141c24" />
    </radialGradient>

    <!-- Succulent & Fern Gradients -->
    <linearGradient id="plantPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d98263" />
      <stop offset="100%" stop-color="#a65437" />
    </linearGradient>
    <linearGradient id="plantGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>
  </defs>

  <!-- 10. GROUND SHADOW -->
  <ellipse cx="200" cy="340" rx="120" ry="15" fill="rgba(0, 0, 0, 0.08)" />
  <ellipse cx="200" cy="338" rx="80" ry="8" fill="rgba(0, 0, 0, 0.05)" />

  <!-- 9. LEFT POTTED PLANT (Succulent) -->
  <g id="left-plant" transform="translate(60, 240)">
    <!-- Shadow under pot -->
    <ellipse cx="20" cy="92" rx="18" ry="4" fill="rgba(0, 0, 0, 0.15)" />
    <!-- Pot -->
    <path d="M5,60 L8,90 A4,4 0 0,0 12,94 L28,94 A4,4 0 0,0 32,90 L35,60 Z" fill="url(#plantPot)" stroke="#8b5a3c" stroke-width="1.5" />
    <ellipse cx="20" cy="60" rx="15" ry="3" fill="#8b5a3c" />
    <!-- Soil -->
    <ellipse cx="20" cy="60" rx="13" ry="2.5" fill="#5c3d2e" />
    <!-- Succulent Leaves -->
    <path d="M20,60 C12,50 10,40 20,25 C30,40 28,50 20,60 Z" fill="url(#plantGreen)" stroke="#2d6a4f" stroke-width="1.2" />
    <path d="M12,60 C6,52 6,44 16,36 C22,44 20,52 12,60 Z" fill="url(#plantGreen)" stroke="#2d6a4f" stroke-width="1.2" />
    <path d="M28,60 C34,52 34,44 24,36 C18,44 20,52 28,60 Z" fill="url(#plantGreen)" stroke="#2d6a4f" stroke-width="1.2" />
    <path d="M6,56 C2,50 4,45 14,45 C20,48 16,53 6,56 Z" fill="#52b788" opacity="0.8" />
    <path d="M34,56 C38,50 36,45 26,45 C20,48 24,53 34,56 Z" fill="#52b788" opacity="0.8" />
  </g>

  <!-- 9. RIGHT POTTED PLANT (Fern) -->
  <g id="right-plant" transform="translate(300, 240)">
    <!-- Shadow under pot -->
    <ellipse cx="20" cy="92" rx="18" ry="4" fill="rgba(0, 0, 0, 0.15)" />
    <!-- Pot -->
    <path d="M5,60 L8,90 A4,4 0 0,0 12,94 L28,94 A4,4 0 0,0 32,90 L35,60 Z" fill="url(#plantPot)" stroke="#8b5a3c" stroke-width="1.5" />
    <ellipse cx="20" cy="60" rx="15" ry="3" fill="#8b5a3c" />
    <!-- Soil -->
    <ellipse cx="20" cy="60" rx="13" ry="2.5" fill="#5c3d2e" />
    <!-- Fern Fronds -->
    <path d="M20,60 Q10,30 -5,15 Q15,25 20,60" fill="none" stroke="url(#plantGreen)" stroke-width="3" stroke-linecap="round" />
    <path d="M20,60 Q20,25 10,5 Q23,20 20,60" fill="none" stroke="url(#plantGreen)" stroke-width="3" stroke-linecap="round" />
    <path d="M20,60 Q30,30 45,15 Q25,25 20,60" fill="none" stroke="url(#plantGreen)" stroke-width="3" stroke-linecap="round" />
    <path d="M20,60 Q35,45 48,40 Q30,48 20,60" fill="none" stroke="url(#plantGreen)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M20,60 Q5,45 -8,40 Q10,48 20,60" fill="none" stroke="url(#plantGreen)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 4. TORTOISE BACK LEGS -->
  <g id="torty-back-legs">
    <!-- Back Left Leg -->
    <path d="M125,270 C110,270 100,285 105,305 C108,315 125,320 140,312 C145,300 140,280 125,270 Z" fill="url(#sageSkinShadow)" stroke="#5a7060" stroke-width="1.5" />
    <!-- Back Right Leg -->
    <path d="M275,270 C290,270 300,285 295,305 C292,315 275,320 260,312 C255,300 260,280 275,270 Z" fill="url(#sageSkinShadow)" stroke="#5a7060" stroke-width="1.5" />
  </g>

  <!-- 2. BODY & TAIL -->
  <!-- Cute wiggly tail -->
  <path d="M110,245 Q90,240 100,230 Q112,230 116,240 Z" fill="url(#sageSkinShadow)" stroke="#5a7060" stroke-width="1.5" />

  <!-- 1. SHELL (Warm Terracotta with Hexagonal Patterns) -->
  <g id="torty-shell">
    <!-- Base Shell Silhouette -->
    <path d="M110,250 C100,160 300,160 290,250 C295,275 105,275 110,250 Z" fill="url(#terracottaShell)" stroke="#8b5a3c" stroke-width="2.5" />
    
    <!-- Gloss highlight layer -->
    <path d="M125,210 C140,175 260,175 275,210" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.25" />

    <!-- Hexagonal Pattern segments (Various Shades of terracotta) -->
    <!-- Hex 1 (Center top) -->
    <polygon points="180,180 220,180 235,205 220,230 180,230 165,205" fill="url(#shellTile1)" stroke="#8b5a3c" stroke-width="1.5" opacity="0.9" />
    <!-- Hex 2 (Left side) -->
    <polygon points="135,200 165,205 180,230 165,255 130,250 115,225" fill="url(#shellTile2)" stroke="#8b5a3c" stroke-width="1.5" opacity="0.85" />
    <!-- Hex 3 (Right side) -->
    <polygon points="235,205 265,200 285,225 270,250 235,255 220,230" fill="url(#shellTile2)" stroke="#8b5a3c" stroke-width="1.5" opacity="0.85" />
    <!-- Hex 4 (Bottom center) -->
    <polygon points="180,230 220,230 235,255 200,268 165,255" fill="url(#shellTile1)" stroke="#8b5a3c" stroke-width="1.5" opacity="0.9" />

    <!-- Shell Rim / Border accent -->
    <path d="M103,252 Q200,285 297,252 C295,260 280,265 200,265 C120,265 105,260 103,252 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1" opacity="0.95" />
  </g>

  <!-- 7. FRONT LEGS -->
  <g id="torty-front-legs">
    <!-- Left Front Leg (Sitting, tapping) -->
    <path d="M130,265 C115,265 110,285 115,315 C118,328 135,332 152,322 C160,310 155,275 130,265 Z" fill="url(#sageSkin)" stroke="#5a7060" stroke-width="1.8" />
    <!-- Paw pads on left foot (3 circles) -->
    <circle cx="123" cy="323" r="2" fill="#8b5a3c" opacity="0.6" />
    <circle cx="130" cy="325" r="2.2" fill="#8b5a3c" opacity="0.6" />
    <circle cx="138" cy="323" r="2" fill="#8b5a3c" opacity="0.6" />

    <!-- Right Front Leg (Raised up, Waving/Joy) -->
    <g id="torty-waving-arm" transform="rotate(-15, 260, 275)">
      <path d="M260,270 C280,260 300,235 305,250 C310,265 295,295 275,302 C262,305 250,285 260,270 Z" fill="url(#sageSkin)" stroke="#5a7060" stroke-width="1.8" />
      <!-- Paw pads on right waving hand -->
      <circle cx="298" cy="254" r="2" fill="#8b5a3c" opacity="0.6" />
      <circle cx="294" cy="247" r="2.2" fill="#8b5a3c" opacity="0.6" />
      <circle cx="286" cy="245" r="2" fill="#8b5a3c" opacity="0.6" />
    </g>
  </g>

  <!-- 3. HEAD & NECK -->
  <!-- Neck -->
  <path d="M185,190 C180,140 220,140 215,190 Z" fill="url(#sageSkinShadow)" stroke="#5a7060" stroke-width="1.5" />
  
  <g id="torty-head" class="tuto-head">
    <!-- Sage green Head -->
    <ellipse cx="200" cy="130" rx="42" ry="38" fill="url(#sageSkin)" stroke="#5a7060" stroke-width="1.5" />

    <!-- Soft blush cheeks (Warm terracotta/sage blend glow) -->
    <ellipse cx="168" cy="144" rx="10" ry="6" fill="#fca5a5" opacity="0.45" />
    <ellipse cx="232" cy="144" rx="10" ry="6" fill="#fca5a5" opacity="0.45" />

    <!-- 4. EYES (Large, Expressive Deep Blue-Gray) -->
    <!-- Left Eye -->
    <ellipse cx="180" cy="122" rx="11" ry="13" fill="#ffffff" />
    <ellipse cx="180" cy="122" rx="8.5" ry="10" fill="url(#eyeIris)" />
    <!-- Pupil shine -->
    <circle cx="183.5" cy="118.5" r="2.8" fill="#ffffff" />
    <circle cx="176.5" cy="125.5" r="1.3" fill="#ffffff" opacity="0.7" />

    <!-- Right Eye -->
    <ellipse cx="220" cy="122" rx="11" ry="13" fill="#ffffff" />
    <ellipse cx="220" cy="122" rx="8.5" ry="10" fill="url(#eyeIris)" />
    <!-- Pupil shine -->
    <circle cx="223.5" cy="118.5" r="2.8" fill="#ffffff" />
    <circle cx="216.5" cy="125.5" r="1.3" fill="#ffffff" opacity="0.7" />

    <!-- Eyebrows capability -->
    <path d="M168,103 Q180,98 190,105" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round" />
    <path d="M232,103 Q220,98 210,105" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round" />

    <!-- 5. NOSE (Tiny nostrils) -->
    <path d="M196,134 Q200,136 204,134" fill="none" stroke="#5a7060" stroke-width="1.8" stroke-linecap="round" />

    <!-- 6. MOUTH (Curved friendly U-smile in Terracotta tone) -->
    <path d="M188,146 Q200,154 212,146" fill="none" stroke="#c97456" stroke-width="2.5" stroke-linecap="round" id="tuto-mouth" />
    <path d="M187,145 Q188,147 189,145" fill="none" stroke="#c97456" stroke-width="2" stroke-linecap="round" />
    <path d="M213,145 Q212,147 211,145" fill="none" stroke="#c97456" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 8. PREMIUM HEADPHONES (Coral orange, Wireless) -->
  <g id="tuto-headphones" class="tuto-headphones active">
    <!-- Headband arch connecting over the head -->
    <path d="M158,110 A48,48 0 0,1 242,110" fill="none" stroke="url(#headphonesCoral)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Left Ear Cup (Glossy rounded disc) -->
    <g transform="translate(142, 114)">
      <!-- Outer casing -->
      <ellipse cx="12" cy="18" rx="14" ry="18" fill="url(#headphonesCoral)" stroke="#d24e2e" stroke-width="1" />
      <!-- Inner cushion / speaker cup -->
      <ellipse cx="12" cy="18" rx="11" ry="15" fill="url(#earcupGloss)" />
      <!-- Silver metallic connection stem -->
      <path d="M12,0 L12,4" fill="none" stroke="#e6e0d8" stroke-width="3" />
    </g>

    <!-- Right Ear Cup -->
    <g transform="translate(234, 114)">
      <!-- Outer casing -->
      <ellipse cx="12" cy="18" rx="14" ry="18" fill="url(#headphonesCoral)" stroke="#d24e2e" stroke-width="1" />
      <!-- Inner cushion -->
      <ellipse cx="12" cy="18" rx="11" ry="15" fill="url(#earcupGloss)" />
      <!-- Connection stem -->
      <path d="M12,0 L12,4" fill="none" stroke="#e6e0d8" stroke-width="3" />
    </g>
  </g>
</svg>
