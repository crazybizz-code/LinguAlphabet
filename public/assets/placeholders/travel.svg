<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Travel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A33"/>
      <stop offset="1" stop-color="#E65F00"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="640" cy="160" r="190" fill="#ffffff" opacity="0.12" filter="url(#blur)"/>
  <circle cx="120" cy="670" r="220" fill="#000000" opacity="0.14" filter="url(#blur)"/>
  <g transform="translate(400,400)" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.94">
    <circle cx="0" cy="0" r="150"/>
    <polygon points="-70,-70 40,-10 10,20 -70,-70" fill="#ffffff" stroke="none"/>
    <polygon points="70,70 -20,10 -10,-20 70,70" fill="#ffffff" stroke="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="none"/>
    <line x1="0" y1="-190" x2="0" y2="-165"/>
    <line x1="0" y1="190" x2="0" y2="165"/>
    <line x1="-190" y1="0" x2="-165" y2="0"/>
    <line x1="190" y1="0" x2="165" y2="0"/>
  </g>
  <text x="64" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" fill-opacity="0.85" letter-spacing="2">TRAVEL</text>
</svg>
