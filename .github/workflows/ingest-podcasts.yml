name: Ingest Podcasts

on:
  workflow_dispatch: {}
  schedule:
    # 08:00 UTC daily — 2 hours after the Vercel article cron (06:00 UTC),
    # so article enrichment quota is not competing with podcast enrichment.
    - cron: "0 8 * * *"

jobs:
  ingest:
    name: Podcast ingestion + ASR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Not a secret — just a model name. Pinned here so a model change is
      # a code review, not a silent environment variable update.
      OPENROUTER_MODEL: google/gemini-2.5-flash
      PYTHON_BIN: python3
      ASR_CACHE_DIR: .asr-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-asr.txt

      - name: Install ASR dependencies
        run: pip install -r scripts/requirements-asr.txt

      # Whisper model weights (~1.5 GB for medium.en). Keyed by the
      # requirements file so a version bump invalidates the cache and
      # re-downloads the correct weights automatically.
      - name: Restore Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-model-medium-en-${{ hashFiles('scripts/requirements-asr.txt') }}

      # Content-addressed ASR cache: .asr-cache/{model}-{sha256(audio)}.json.
      # Restored before the run so unchanged episodes are never re-transcribed.
      # Saved after (even on failure) so partial progress survives an outage.
      - name: Restore ASR cache
        uses: actions/cache/restore@v4
        with:
          path: .asr-cache
          key: asr-cache-${{ github.run_id }}
          restore-keys: |
            asr-cache-

      - name: Run podcast ingestion
        run: npm run ingest-podcasts

      - name: Save ASR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .asr-cache
          key: asr-cache-${{ github.run_id }}
